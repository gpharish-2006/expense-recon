[package]
name = "recon_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "recon_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rayon = "1.10"
csv = "1.3"
pdf-extract = "0.7"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"